name: Release — B8G IDE (WebRenderer Host + b8g-devplane VS Code Extension)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release-b8g-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run B8G IDE & b8g-devplane Extension Tests
        run: node --test b8g-ide.test.mts
      - name: Package B8G IDE & Extension Release
        run: |
          mkdir -p dist
          tar -czf dist/b8g-devplane-extension.tar.gz extensions/b8g-devplane devplane
          tar -czf dist/b8g-ide-webrenderer-host.tar.gz host devplane extensions/b8g-devplane README.md LICENSE
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.0' }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "B8G IDE ${TAG} — Zero-Electron VS Code OSS WebRenderer Host & b8g-devplane Extension" \
            --notes "Unmodified VS Code OSS WebRenderer host + standard \`b8g-devplane\` VS Code extension supplying env, \`B8G_DISPLAY_V1\` display, sandboxed \`b8g-devplane://\` FS, \`ttyS0\` terminal, and DevTools streams."
