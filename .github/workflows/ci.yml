name: CI — B8G IDE (WebRenderer + b8g-devplane Extension)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: 'Sectium Browser baseline tag'
        required: true
        default: 'v0.5.0-baseline'

jobs:
  verify-b8g-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run B8G IDE & b8g-devplane Extension Test Suite
        run: node --test b8g-ide.test.mts

      - name: Hydrate & Verify Sectium Display + Shim Directly from Canonical O(1) Ghost CAS (cas-v1)
        run: |
          node -e "
            const crypto = require('crypto');
            const INDEX_URL = 'https://raw.githubusercontent.com/awesome-os/b8g-ghost/main/manifests/index.json';
            (async () => {
              const idx = await (await fetch(INDEX_URL)).json();
              console.log('[b8g-ide] Connected to Ghost CAS:', idx.schema, 'entries=' + idx.total_entries);
              for (const f of ['lumi-white-dragon.ico', 'libsectium_display-linux-x64.so', 'b8g-shim-linux-x64']) {
                const entry = idx.entries[f];
                if (!entry) throw new Error('Missing ' + f + ' in canonical Ghost CAS index');
                const buf = Buffer.from(await (await fetch(entry.download_url)).arrayBuffer());
                const hash = crypto.createHash('sha256').update(buf).digest('hex');
                if (hash !== entry.sha256) throw new Error('SHA-256 mismatch for ' + f);
                console.log('[CAS-VERIFIED]', f, buf.length, 'bytes, sha256=' + hash.slice(0, 16) + '...');
              }
            })();
          "
          tar -czf b8g-devplane-extension.tar.gz extensions/b8g-devplane devplane host
      - uses: actions/upload-artifact@v4
        with:
          name: b8g-devplane-extension
          path: b8g-devplane-extension.tar.gz
